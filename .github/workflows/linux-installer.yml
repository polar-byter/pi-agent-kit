name: Legacy OpenCode Linux installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth desktop-file-utils
      - name: Build installer
        run: python3 -m kit.linux_package --version 0.2.0 --output dist/opencode-kit_0.2.0_all.deb
      - name: Validate and install package
        run: |
          dpkg-deb --info dist/opencode-kit_0.2.0_all.deb
          sudo apt-get install -y ./dist/opencode-kit_0.2.0_all.deb
      - name: Prepare the pinned runtime through the native launcher
        run: sh /usr/share/opencode-kit/kit/python.sh --kit-runtime-path
      - name: Check package and real Linux windows
        env:
          OPENCODE_KIT_DASHBOARD: 'off'
          XDG_CONFIG_HOME: '${{ runner.temp }}/opencode-kit-smoke'
        run: |
          sh kit/python.sh -m kit.task_metrics start --task linux-package-smoke --title 'Linux desktop package verification' --no-dashboard
          sh kit/python.sh -m kit.task_metrics test --task linux-package-smoke --scope linux-package -- xvfb-run -a sh kit/python.sh -u -m kit.tests.linux_desktop_smoke -v
          sh kit/python.sh -m kit.task_metrics test --task linux-package-smoke --scope bootstrap -- sh kit/python.sh -m unittest kit.tests.test_python_runtime -v
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-kit-linux-deb
          path: dist/*.deb
