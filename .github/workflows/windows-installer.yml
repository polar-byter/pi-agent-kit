name: Pi Kit on Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  kit-tests:
    runs-on: windows-2022
    env:
      PI_KIT_RUNTIME_HOME: '${{ runner.temp }}\pi-kit-python'
      PI_KIT_NATIVE_SMOKE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare the pinned private Python runtime
        run: .\kit\python.cmd --kit-runtime-path
      - name: Install the pinned project-local Pi runtime
        run: .\kit\python.cmd -B -c "from pathlib import Path; from kit.pi_installation import install_pi_runtime; install_pi_runtime(Path.cwd())"
      - name: Run kit, configurator, dashboard and native Pi checks
        run: |
          .\kit\python.cmd -B -u -m kit.test_completed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
